<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Prompt order and rejected result</title>
  <desc id="desc">Changing metadata moves behind stable instructions before a result not verified marker.</desc>
  <rect width="640" height="400" fill="#fbfaf6"/>
  <g stroke="#cbc9c1" stroke-width="1"><path d="M0 80h640M0 160h640M0 240h640M0 320h640"/><path d="M128 0v400M256 0v400M384 0v400M512 0v400"/></g>
  <g transform="translate(54 65)">
    <text x="0" y="0" fill="#686b67" font-family="ui-monospace,monospace" font-size="13">BASELINE</text>
    <rect x="0" y="24" width="92" height="42" fill="#efe1d9" stroke="#8a4b32"/><rect x="92" y="24" width="300" height="42" fill="#ecece7" stroke="#9d9c95"/>
    <rect x="0" y="76" width="92" height="42" fill="#efe1d9" stroke="#8a4b32"/><rect x="92" y="76" width="300" height="42" fill="#ecece7" stroke="#9d9c95"/>
    <text x="12" y="51" fill="#8a4b32" font-family="ui-monospace,monospace" font-size="11">CHANGING</text><text x="112" y="51" fill="#171a19" font-family="ui-monospace,monospace" font-size="11">STABLE INSTRUCTIONS</text>
  </g>
  <g transform="translate(54 224)">
    <text x="0" y="0" fill="#236b5b" font-family="ui-monospace,monospace" font-size="13">CANDIDATE</text>
    <rect x="0" y="24" width="300" height="42" fill="#dce8e2" stroke="#236b5b"/><rect x="300" y="24" width="92" height="42" fill="#efe1d9" stroke="#8a4b32"/>
    <rect x="0" y="76" width="300" height="42" fill="#dce8e2" stroke="#236b5b"/><rect x="300" y="76" width="92" height="42" fill="#efe1d9" stroke="#8a4b32"/>
    <text x="18" y="51" fill="#171a19" font-family="ui-monospace,monospace" font-size="11">STABLE INSTRUCTIONS</text><text x="312" y="51" fill="#8a4b32" font-family="ui-monospace,monospace" font-size="11">CHANGING</text>
  </g>
  <g transform="translate(474 132)"><rect width="122" height="126" fill="#f4f1ea" stroke="#171a19" stroke-width="2"/><path d="M18 28h86M18 44h56" stroke="#9d9c95"/><circle cx="29" cy="82" r="8" fill="none" stroke="#8a4b32" stroke-width="2"/><path d="m25 82 3 3 6-8" fill="none" stroke="#8a4b32" stroke-width="2"/><text x="18" y="108" fill="#171a19" font-family="ui-sans-serif,sans-serif" font-size="12" font-weight="600">Not verified</text></g>
</svg>
