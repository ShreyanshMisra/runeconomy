<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">RunEconomy workflow</title><desc id="desc">Five connected stages from a trace to a gated verdict.</desc>
  <rect width="640" height="400" fill="#f4f1ea"/><g stroke="#cbc9c1"><path d="M0 80h640M0 160h640M0 240h640M0 320h640"/><path d="M128 0v400M256 0v400M384 0v400M512 0v400"/></g>
  <path d="M78 204h484" stroke="#9d9c95" stroke-width="2"/><g font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">
    <g transform="translate(82 204)"><circle r="34" fill="#fbfaf6" stroke="#171a19"/><text y="4" fill="#171a19">TRACE</text></g>
    <g transform="translate(201 204)"><circle r="34" fill="#fbfaf6" stroke="#171a19"/><text y="4" fill="#171a19">DIAGNOSE</text></g>
    <g transform="translate(320 204)"><circle r="34" fill="#fbfaf6" stroke="#171a19"/><text y="4" fill="#171a19">TEST</text></g>
    <g transform="translate(439 204)"><circle r="34" fill="#dce8e2" stroke="#236b5b"/><text y="4" fill="#236b5b">GATE</text></g>
    <g transform="translate(558 204)"><rect x="-42" y="-34" width="84" height="68" fill="#171a19"/><text y="4" fill="#fbfaf6">VERDICT</text></g>
  </g><g fill="#171a19"><path d="m143 198 12 6-12 6Z"/><path d="m262 198 12 6-12 6Z"/><path d="m381 198 12 6-12 6Z"/><path d="m500 198 12 6-12 6Z"/></g>
