name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run pytest -q
      - name: Check whitespace
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build
      - name: Check package metadata
        run: uvx --from twine twine check dist/*
      - name: Smoke-test installed wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uvx --from "$wheel" runeconomy demo --output /tmp/runeconomy-demo.html
          test -s /tmp/runeconomy-demo.html
      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
