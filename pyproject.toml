[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "runeconomy"
version = "0.3.0"
description = "Find inference waste in agent workflows and verify performance improvements"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "shrey" }]
keywords = [
    "ai-agents",
    "inference",
    "llm",
    "observability",
    "performance",
    "vllm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://runeconomy.vercel.app/"
Documentation = "https://runeconomy.vercel.app/start/"
Repository = "https://github.com/ShreyanshMisra/runeconomy"
Issues = "https://github.com/ShreyanshMisra/runeconomy/issues"

[project.scripts]
runeconomy = "runeconomy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runeconomy"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/docs",
    "/examples",
    "/pyproject.toml",
    "/skills",
    "/src",
]
exclude = [
    "/docs/internal",
    "/docs/drafts",
    "/examples/experiments/repository-agent-tool-pruning-heldout.json",
    "/examples/fixtures/recorded-cli-build-parser.txt",
]

[dependency-groups]
dev = [
    "modal>=1.6.3",
    "opentelemetry-sdk>=1.38,<2",
    "pytest>=8.3,<10",
    "ruff>=0.17.5",
]

[tool.ruff]
extend-exclude = ["artifacts", "reports", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These files are hash-pinned by the frozen public proof and must stay
# byte-identical, so their unused imports are accepted rather than removed.
"deploy/modal_public_proof.py" = ["F401"]
"examples/reliable_proof/agent.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
