# Copy to .github/workflows/runeconomy-verify.yml in the repository under test.
# It runs a frozen RunEconomy experiment whenever a pull request changes
# prompts, tools or serving configuration, and posts one verdict comment.
name: RunEconomy verify

on:
  pull_request:
    paths:
      - "prompts/**"
      - "tools/**"
      - "serving/**"
      - "agent/**"
      - "experiment/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: runeconomy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Serving credentials, if the experiment needs them, come from secrets.
      # Never echo them; RunEconomy reads only the variable named in the manifest.
      - uses: ShreyanshMisra/runeconomy@v0.3.0
        with:
          workspace: experiment
          mode: frozen
          require-verified: "true"
          runeconomy-version: runeconomy==0.3.0
        env:
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
